<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGCORJ — Gestão de Ocorrências e Reincidências</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1224;--s:#0e1a33;--s2:#132340;--ln:rgba(150,180,220,.12);--ln2:rgba(150,180,220,.22);--w:#f3f7fc;--g1:#eaf1fa;--g2:#c9d6e8;--g3:#a3b6d0;--ac:#2dbfff;--ac2:#1a9fe0;--ok:#34d399;--wr:#fbbf24;--er:#f87171;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--w);font-size:14px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 32px;border-bottom:1px solid var(--ln);background:rgba(10,18,36,.85);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:14px}.brand svg{width:40px;height:40px}.brand h1{font-size:18px;font-weight:800}.brand p{font-size:13px;color:var(--g2);margin-top:2px}
.pill{font-size:13px;font-weight:600;border:1px solid var(--ln2);border-radius:999px;padding:7px 14px;color:var(--g1)}
.btn{background:var(--ac2);color:#04101f;border:0;border-radius:9px;padding:9px 16px;font-weight:800;cursor:pointer}.btn:hover{background:var(--ac)}
.btn.gh{background:none;border:1px solid var(--ln2);color:var(--g1);font-weight:600}.btn.gh:hover{background:rgba(255,255,255,.05)}
.btn.sm{padding:5px 11px;font-size:13px}.btn.er{background:rgba(248,113,113,.15);color:var(--er)}
.tabs{display:flex;gap:4px;padding:0 32px;border-bottom:1px solid var(--ln);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--g2);padding:14px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--w);border-color:var(--ac)}
main{max-width:1320px;margin:0 auto;padding:26px 32px 60px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:20px 22px;margin-top:16px}
.card h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.sub{font-size:13px;font-weight:500;color:var(--g2)}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.kpi{background:var(--s);padding:18px 18px 20px}.kpi b{display:block;font-size:30px;font-weight:700;margin-top:10px}.kpi span{font-size:12.5px;color:var(--g2);font-weight:600}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}main,.top,.tabs{padding-left:16px;padding-right:16px}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.g2{grid-template-columns:1fr}}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.bar .l{flex:0 0 38%;color:var(--g1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .t{flex:1;height:9px;background:rgba(255,255,255,.06);border-radius:5px}.bar .t i{display:block;height:100%;background:var(--ac2);border-radius:5px}.bar .n{width:30px;text-align:right;font-weight:700}
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fl label,.fm label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--g2)}
input,select,textarea{background:var(--bg);border:1px solid var(--ln2);color:var(--g1);border-radius:9px;padding:9px 12px;min-width:140px}
textarea{width:100%;min-height:84px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:700;color:var(--g2);padding:11px 12px;border-bottom:1px solid var(--ln2);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--ln);color:var(--g1);vertical-align:top}
tr.cl{cursor:pointer}tr.cl:hover{background:rgba(45,191,255,.05)}
.bd{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.08);color:var(--g1);white-space:nowrap}
.bd.ok{background:rgba(52,211,153,.14);color:var(--ok)}.bd.wr{background:rgba(251,191,36,.14);color:var(--wr)}.bd.er{background:rgba(248,113,113,.14);color:var(--er)}.bd.ac{background:rgba(45,191,255,.14);color:var(--ac)}
.al{border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.07);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.6;margin:12px 0}
.al b.t{display:block;color:var(--wr);margin-bottom:4px;letter-spacing:.3px}.al.in{border-color:var(--ln2);background:rgba(255,255,255,.03)}
.empty{text-align:center;color:var(--g2);padding:30px}
.note{font-size:12.5px;color:var(--g3);line-height:1.6;margin-top:10px}
#modal .bg{position:fixed;inset:0;background:rgba(4,9,20,.78);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto;backdrop-filter:blur(5px)}
#modal .box{background:var(--s2);border:1px solid var(--ln2);border-radius:18px;padding:24px 26px;width:100%;max-width:760px}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}.mh h2{font-size:20px;font-weight:800}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fm .f{grid-column:1/-1}@media(max-width:600px){.fm{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:14px 0}.kv b{display:block;font-size:12.5px;color:var(--g3);font-weight:600;margin-bottom:2px}
.sec{font-size:13px;font-weight:800;color:var(--g2);margin:20px 0 8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--ln)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--ln2);padding:11px 18px;border-radius:10px;font-weight:600;z-index:99;display:none}
.gate{max-width:480px;margin:90px auto;text-align:center;line-height:1.7}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 120 120" aria-hidden="true"><g transform="translate(10,10)"><rect x="15" y="15" width="70" height="70" rx="12" transform="rotate(45 50 50)" fill="#1a9fe0"/><rect x="22" y="22" width="56" height="56" rx="8" transform="rotate(45 50 50)" fill="#0f2044"/><polygon points="72,50 50,28 50,40 28,40 28,60 50,60 50,72" fill="#1a9fe0"/></g></svg>
    <div><h1>Gestão de Ocorrências e Reincidências</h1><p>SIGCORJ — registro, tratativas e histórico por motorista</p></div>
  </div>
  <div class="fl"><span class="pill" id="who">—</span><a class="btn gh" href="index.html" style="text-decoration:none">Voltar ao SIGCORJ</a></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"><div class="empty">Carregando…</div></main>
<div id="modal"></div><div id="toast"></div>

<script>
var SB='https://redbfzxpdbmojpocbtis.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlZGJmenhwZGJtb2pwb2NidGlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NzIzOTUsImV4cCI6MjA5NjI0ODM5NX0.MBH4vNSQFHkwiZO6Si6Y2mYck4hCcVavYEUOEo90g9I';
var S={emp:'',plano:'',nome:'',uid:'',mot:[],cat:[],oc:[],doc:[],tab:'painel',f:{q:'',cat:'',st:'',vin:'',de:'',ate:''},dp:{de:'',ate:''}};
var ST={registrada:'Registrada',em_analise:'Em análise',aguardando_info:'Aguardando informações',em_tratativa:'Em tratativa',aguardando_ciencia:'Aguardando ciência',em_acompanhamento:'Em acompanhamento',encerrada:'Encerrada',cancelada:'Cancelada'};
var DST={emitido:'Emitido',entregue:'Entregue, aguardando ciência',ciencia:'Ciência registrada',recusada:'Ciência recusada ou não obtida',cancelado:'Cancelado ou substituído'};
var DT={carta:'Carta de reorientação',advertencia:'Advertência',comunicado:'Comunicado de desvio operacional'};
var TRAT=['Orientação registrada','Carta de reorientação','Advertência (quando aplicável)','Acompanhamento','Encerrado sem medida'];
var SUG=['Descumprimento de procedimento operacional','Excesso de jornada ou descumprimento de programação','Descumprimento de descanso ou pausa','Falha de comunicação com a operação','Não utilização de aplicativo ou ferramenta obrigatória','Descumprimento de procedimento de coleta ou entrega','Avaria, colisão ou dano material','Infração de trânsito','Uso inadequado de veículo ou equipamento','Falha no envio de documentos ou informações','Conduta inadequada','Descumprimento de orientação previamente formalizada','Outros'];
var GRAV={leve:'Leve',media:'Média',grave:'Grave'};

/* ── utilidades ── */
function $(i){return document.getElementById(i)}
function e(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fd(v){return v?new Date(v).toLocaleDateString('pt-BR'):'—'}
function fdt(v){return v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—'}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._h);toast._h=setTimeout(function(){t.style.display='none'},3800)}
function canW(){return S.plano==='admin'}
function numOc(o){return 'OC-'+new Date(o.criado_em||o.data_ocorrencia).getFullYear()+'-'+String(o.id).padStart(5,'0')}
function mk(o){return o.motorista_id||o.motorista_nome}
function vinc(v){return v==='px'?'PX':'Frota própria'}
function modal(h){$('modal').innerHTML='<div class="bg" onclick="if(event.target===this)closeM()"><div class="box">'+h+'</div></div>'}
function closeM(){$('modal').innerHTML=''}
function gate(m){$('view').innerHTML='<div class="gate"><h2>'+e(m)+'</h2><p style="margin-top:14px"><a class="btn" href="index.html" style="text-decoration:none;display:inline-block">Abrir o SIGCORJ</a></p></div>'}

/* ── acesso ao Supabase (usa a mesma sessão do SIGCORJ) ── */
function sess(){try{return JSON.parse(localStorage.getItem('encaixe_session')||'null')}catch(x){return null}}
async function refresh(){var s=sess();if(!s||!s.refresh_token)return false;try{var r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(!r.ok)return false;localStorage.setItem('encaixe_session',JSON.stringify(await r.json()));return true}catch(x){return false}}
async function api(path,o){o=o||{};function go(){var s=sess();return fetch(SB+'/rest/v1/'+path,{method:o.method||'GET',body:o.body,headers:{apikey:KEY,Authorization:'Bearer '+(s?s.access_token:KEY),'Content-Type':'application/json',Prefer:o.prefer||''}})}
  var r=await go();if(r.status===401&&await refresh())r=await go();
  if(!r.ok)throw new Error(r.status+': '+await r.text());var t=await r.text();return t?JSON.parse(t):null}
async function audit(id,acao,det){try{await api('adv_auditoria',{method:'POST',body:JSON.stringify({empresa:S.emp,ocorrencia_id:id,acao:acao,detalhe:det||{},usuario:S.nome})})}catch(x){}}

async function boot(){
  var s=sess();if(!s||!s.user){gate('Sessão não encontrada. Entre no SIGCORJ primeiro (mesmo navegador) e volte aqui.');return}
  try{
    var p=await api('perfis?id=eq.'+s.user.id+'&select=plano,empresa,nome&limit=1');p=(p&&p[0])||{};
    S.emp=(p.empresa||'').trim().toLowerCase();S.plano=(p.plano||'leitor').toLowerCase().trim();S.nome=p.nome||s.user.email||'';S.uid=s.user.id;
    if(!S.emp)throw new Error('Perfil sem empresa definida.');
    $('who').textContent=S.emp.toUpperCase()+' · '+(canW()?'Gestão':'Somente consulta');
    await load();render();
  }catch(x){gate('Erro ao carregar: '+x.message+(/42P01|PGRST205|does not exist/.test(x.message)?' — execute o arquivo ocorrencias_schema.sql no Supabase.':''))}
}
async function load(){
  var q='&empresa=eq.'+encodeURIComponent(S.emp);
  var r=await Promise.all([api('motoristas?select=*&order=nome.asc'+q),api('adv_categorias?select=*&order=nome.asc'+q),
    api('adv_ocorrencias?select=*&order=data_ocorrencia.desc&limit=5000'+q),
    api('adv_documentos?select=id,ocorrencia_id,tipo,numero,versao,status,emitido_por,emitido_em,entregue_em,ciencia_em,ciencia_obs&order=emitido_em.desc&limit=5000'+q)]);
  S.mot=r[0]||[];S.cat=r[1]||[];S.oc=r[2]||[];S.doc=r[3]||[];
}

/* ── regra de reincidência (somente alerta; nunca aplica medida) ── */
function prior(o){
  var c=S.cat.find(function(x){return x.id==o.categoria_id}),d=(c&&c.periodo_dias)||90,t=+new Date(o.data_ocorrencia);
  return S.oc.filter(function(x){var xt=+new Date(x.data_ocorrencia);return x.id!==o.id&&mk(x)===mk(o)&&x.categoria_id==o.categoria_id&&x.status!=='cancelada'&&xt<=t&&xt>=t-d*864e5})
    .sort(function(a,b){return new Date(b.data_ocorrencia)-new Date(a.data_ocorrencia)});
}
function sugest(n){return n<=1?'Registro e avaliação inicial.':n==2?'Alerta de reincidência e avaliação de reorientação.':n==3?'Alerta de reincidência recorrente e avaliação de advertência, quando aplicável.':'Alerta de recorrência elevada e encaminhamento para análise da gestão.'}
function pendDocs(o){var ids=S.oc.filter(function(x){return mk(x)===mk(o)}).map(function(x){return x.id});return S.doc.filter(function(d){return ids.indexOf(d.ocorrencia_id)>=0&&(d.status==='emitido'||d.status==='entregue')})}
function alertaHTML(o){
  var pr=prior(o),pd=pendDocs(o).filter(function(d){return d.ocorrencia_id!==o.id||o.id>0}),h='';
  if(pr.length){var u=pr[0];h+='<div class="al"><b class="t">REINCIDÊNCIA IDENTIFICADA</b>Motorista: <b>'+e(o.motorista_nome)+'</b><br>Categoria: <b>'+e(o.categoria_nome||'')+'</b><br>Ocorrências anteriores no período: <b>'+pr.length+'</b> (esta é a '+(pr.length+1)+'ª)<br>Última ocorrência: '+fd(u.data_ocorrencia)+'<br>Última tratativa: '+e(u.tratativa||'não definida')+'<br>Ação sugerida: '+sugest(pr.length+1)+' Registre a decisão tomada.<div class="note">Alerta para análise humana. O sistema não aplica medidas nem conclui responsabilidade.</div></div>'}
  if(pd.length)h+='<div class="al"><b class="t">DOCUMENTO PENDENTE DE CIÊNCIA</b>Este motorista tem '+pd.length+' documento(s) emitido(s) sem ciência registrada.</div>';
  return h||'<div class="al in">Sem ocorrências anteriores da mesma categoria no período configurado. '+sugest(1)+'</div>';
}

/* ── navegação ── */
function render(){
  var T=[['painel','Painel'],['ocorrencias','Ocorrências'],['historico','Histórico do motorista'],['categorias','Categorias e regras']];
  $('tabs').innerHTML=T.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" onclick="S.tab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join('');
  ({painel:vPainel,ocorrencias:vLista,historico:vHist,categorias:vCat})[S.tab]();
}
function inRange(d,de,ate){var t=+new Date(d);return(!de||t>=+new Date(de+'T00:00:00'))&&(!ate||t<=+new Date(ate+'T23:59:59'))}
function bars(list){if(!list.length)return '<div class="empty">Sem dados no período.</div>';var m=Math.max.apply(null,list.map(function(x){return x[1]}));
  return list.map(function(x){return '<div class="bar"><span class="l" title="'+e(x[0])+'">'+e(x[0])+'</span><span class="t"><i style="width:'+(x[1]/m*100)+'%"></i></span><span class="n">'+x[1]+'</span></div>'}).join('')}
function count(arr,fn){var m={};arr.forEach(function(x){var k=fn(x)||'(não informado)';m[k]=(m[k]||0)+1});return Object.keys(m).map(function(k){return[k,m[k]]}).sort(function(a,b){return b[1]-a[1]})}

/* ── painel ── */
function vPainel(){
  var oc=S.oc.filter(function(o){return inRange(o.data_ocorrencia,S.dp.de,S.dp.ate)&&o.status!=='cancelada'});
  var ids=oc.map(function(o){return o.id}),dc=S.doc.filter(function(d){return ids.indexOf(d.ocorrencia_id)>=0&&d.status!=='cancelado'});
  var K=[['Ocorrências',oc.length],['Motoristas c/ ocorrência',new Set(oc.map(mk)).size],['Reincidências',oc.filter(function(o){return o.ordem_categoria>1}).length],
    ['Advertências emitidas',dc.filter(function(d){return d.tipo==='advertencia'}).length],['Cartas de reorientação',dc.filter(function(d){return d.tipo==='carta'}).length],
    ['Aguardando apuração',oc.filter(function(o){return['registrada','em_analise','aguardando_info'].indexOf(o.status)>=0}).length],['Docs pendentes de ciência',dc.filter(function(d){return d.status==='emitido'||d.status==='entregue'}).length]];
  var rk={};oc.forEach(function(o){var k=mk(o);(rk[k]=rk[k]||{n:o.motorista_nome,t:0,r:0,c:{},u:o})
    ;rk[k].t++;if(o.ordem_categoria>1)rk[k].r++;rk[k].c[o.categoria_nome]=1;if(new Date(o.data_ocorrencia)>new Date(rk[k].u.data_ocorrencia))rk[k].u=o});
  var R=Object.keys(rk).map(function(k){return rk[k]}).sort(function(a,b){return b.t-a.t||b.r-a.r}).slice(0,15);
  $('view').innerHTML='<div class="fl"><label>De<input type="date" value="'+S.dp.de+'" onchange="S.dp.de=this.value;vPainel()"></label><label>Até<input type="date" value="'+S.dp.ate+'" onchange="S.dp.ate=this.value;vPainel()"></label></div>'
  +'<div class="kpis" style="margin-top:16px">'+K.map(function(k){return '<div class="kpi"><span>'+k[0]+'</span><b>'+k[1]+'</b></div>'}).join('')+'</div>'
  +'<div class="g2"><div class="card"><h3>Ocorrências por categoria</h3>'+bars(count(oc,function(o){return o.categoria_nome}).slice(0,10))+'</div>'
  +'<div class="card"><h3>Ocorrências por operação</h3>'+bars(count(oc,function(o){return o.operacao}).slice(0,10))+'</div></div>'
  +'<div class="g2"><div class="card"><h3>Evolução mensal</h3>'+bars(count(oc,function(o){return o.data_ocorrencia.slice(0,7)}).sort(function(a,b){return a[0]<b[0]?-1:1}))+'</div>'
  +'<div class="card"><h3>Frota própria × PX</h3>'+bars(count(oc,function(o){return vinc(o.vinculo)}))+'</div></div>'
  +'<div class="card"><h3>Ranking de recorrência <span class="sub">motoristas com mais registros no período</span></h3><div class="tw"><table><tr><th>Motorista</th><th>Ocorrências</th><th>Reincidências</th><th>Categorias</th><th>Última tratativa</th><th>Pendências</th></tr>'
  +(R.length?R.map(function(r){return '<tr><td><b>'+e(r.n)+'</b></td><td>'+r.t+'</td><td>'+r.r+'</td><td>'+e(Object.keys(r.c).slice(0,3).join(', '))+'</td><td>'+e(r.u.tratativa||'—')+'</td><td>'+pendDocs(r.u).length+'</td></tr>'}).join(''):'<tr><td colspan="6" class="empty">Sem ocorrências no período.</td></tr>')
  +'</table></div><div class="note">O ranking representa registros operacionais e não constitui, isoladamente, conclusão sobre responsabilidade ou desempenho individual.</div></div>';
}

/* ── lista de ocorrências ── */
function filtradas(){var f=S.f,q=f.q.toLowerCase();return S.oc.filter(function(o){return(!q||(o.motorista_nome+' '+(o.placa||'')+' '+numOc(o)+' '+(o.descricao||'')).toLowerCase().indexOf(q)>=0)&&(!f.cat||o.categoria_id==f.cat)&&(!f.st||o.status===f.st)&&(!f.vin||o.vinculo===f.vin)&&inRange(o.data_ocorrencia,f.de,f.ate)})}
function vLista(){
  var L=filtradas(),f=S.f;
  $('view').innerHTML='<div class="card" style="margin-top:0"><div class="fl"><label>Busca (motorista, placa, nº)<input value="'+e(f.q)+'" oninput="S.f.q=this.value;lista()" style="min-width:220px"></label>'
  +'<label>Categoria<select onchange="S.f.cat=this.value;lista()"><option value="">Todas</option>'+S.cat.map(function(c){return '<option value="'+c.id+'"'+(f.cat==c.id?' selected':'')+'>'+e(c.nome)+'</option>'}).join('')+'</select></label>'

   +'<div class="g2"><div class="card"><h3>Por categoria</h3>'+bars(count(oc,function(o){return o.categoria_nome}))+'</div><div class="card"><h3>Dados do motorista</h3><div class="kv"><div><b>Vínculo</b>'+(oc[0]?vinc(oc[0].vinculo):'—')+'</div><div><b>Operação atual</b>'+e((oc[0]&&oc[0].operacao)||'—')+'</div></div></div></div>'
   +'<div class="card"><h3>Histórico cronológico</h3><div class="tw"><table><tr><th>Nº</th><th>Data</th><th>Categoria</th><th>Reinc.</th><th>Tratativa</th><th>Status</th></tr>'+(oc.length?oc.map(function(o){return '<tr class="cl" onclick="openOc('+o.id+')"><td>'+numOc(o)+'</td><td>'+fdt(o.data_ocorrencia)+'</td><td>'+e(o.categoria_nome)+'</td><td>'+(o.ordem_categoria>1?o.ordem_categoria+'ª':'—')+'</td><td>'+e(o.tratativa||'—')+'</td><td>'+ST[o.status]+'</td></tr>'}).join(''):'<tr><td colspan="6" class="empty">Sem ocorrências registradas.</td></tr>')+'</table></div></div>':'<div class="empty">Selecione um motorista para ver o histórico consolidado.</div>');
}

/* ── categorias e regras de reincidência ── */
function vCat(){
  $('view').innerHTML='<div class="card" style="margin-top:0"><h3>Categorias de ocorrência <span class="sub">período = janela em dias para considerar reincidência</span></h3><div class="tw"><table><tr><th>Categoria</th><th>Período (dias)</th><th>Ativa</th><th></th></tr>'
  +(S.cat.length?S.cat.map(function(c){return '<tr><td><b>'+e(c.nome)+'</b></td><td><input type="number" min="1" id="cp'+c.id+'" value="'+c.periodo_dias+'" style="min-width:90px;width:100px"'+(canW()?'':' disabled')+'></td><td><input type="checkbox" id="ca'+c.id+'" style="min-width:0"'+(c.ativo?' checked':'')+(canW()?'':' disabled')+'></td><td>'+(canW()?'<button class="btn gh sm" onclick="saveCat('+c.id+')">Salvar</button>':'')+'</td></tr>'}).join(''):'<tr><td colspan="4" class="empty">Nenhuma categoria cadastrada.</td></tr>')+'</table></div>'
  +(canW()?'<div class="fl" style="margin-top:16px"><label>Nova categoria<input id="nc" style="min-width:300px"></label><label>Período (dias)<input id="np" type="number" value="90" style="min-width:90px;width:100px"></label><button class="btn" onclick="addCat()">Adicionar</button>'+(S.cat.length?'':'<button class="btn gh" onclick="seedCat()">Carregar categorias sugeridas</button>')+'</div>':'')
  +'<div class="note">Categorias nunca são excluídas, apenas desativadas, para preservar o histórico. As regras só geram alertas para análise; não aplicam medidas.</div></div>'
  +'<div class="card"><h3>Escalonamento sugerido pelo sistema</h3><div class="note" style="margin-top:0">1ª: registro e avaliação inicial · 2ª: alerta de reincidência e avaliação de reorientação · 3ª: reincidência recorrente e avaliação de advertência, quando aplicável · 4ª em diante: recorrência elevada, encaminhar para análise da gestão. Critérios disciplinares e fluxos de frota própria e PX devem ser validados pela empresa.</div></div>';
}
async function saveCat(id){try{await api('adv_categorias?id=eq.'+id,{method:'PATCH',body:JSON.stringify({periodo_dias:parseInt($('cp'+id).value)||90,ativo:$('ca'+id).checked})});await load();render();toast('Categoria atualizada.')}catch(x){toast('Erro: '+x.message)}}
async function addCat(){var n=$('nc').value.trim();if(!n)return;try{await api('adv_categorias',{method:'POST',body:JSON.stringify({empresa:S.emp,nome:n,periodo_dias:parseInt($('np').value)||90})});await load();render();toast('Categoria adicionada.')}catch(x){toast('Erro: '+x.message)}}
async function seedCat(){try{await api('adv_categorias',{method:'POST',body:JSON.stringify(SUG.map(function(n){return{empresa:S.emp,nome:n,periodo_dias:90}}))});await load();render();toast('Categorias sugeridas carregadas (90 dias). Ajuste os períodos.')}catch(x){toast('Erro: '+x.message)}}
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeM()});
boot();
</script>
</body>
</html>
